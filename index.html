<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Time Table</title>
    <meta name="description" content="Weekly class timetable with today's schedule, the current class and a countdown to the next one.">
    <meta name="theme-color" content="#FAF8F3">

    <!-- Apply the saved theme before first paint to avoid a flash -->
    <script>
        (function () {
            var theme;
            try { theme = localStorage.getItem("tt-theme"); } catch (e) {}
            if (theme !== "light" && theme !== "dark") {
                theme = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
            }
            document.documentElement.dataset.theme = theme;
        })();
    </script>

    <link rel="stylesheet" href="style.css">
</head>
<body>

<a class="skip-link" href="#dayPanel">Skip to schedule</a>

<div class="app">

    <header class="topbar">
        <div class="brand">
            <span class="brand-mark" aria-hidden="true">
                <svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>
            </span>
            <div>
                <p class="brand-name">Time Table</p>
                <p class="brand-date" id="todayDate"></p>
            </div>
        </div>

        <div class="topbar-actions">
            <button type="button" class="btn-today" id="todayBtn" hidden>
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>
                Today
            </button>
            <button type="button" class="icon-btn" id="themeToggle" aria-label="Switch to dark theme">
                <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z"/></svg>
                <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
            </button>
        </div>
    </header>

    <main>

        <!-- Live status: current class, break, or next class countdown -->
        <section class="now" id="nowPanel" aria-label="Right now"></section>
        <p class="visually-hidden" id="nowAnnounce" aria-live="polite"></p>

        <nav class="days" role="tablist" aria-label="Days of the week">
            <button type="button" class="day" role="tab" data-day="Monday" aria-controls="dayPanel">Mon</button>
            <button type="button" class="day" role="tab" data-day="Tuesday" aria-controls="dayPanel">Tue</button>
            <button type="button" class="day" role="tab" data-day="Wednesday" aria-controls="dayPanel">Wed</button>
            <button type="button" class="day" role="tab" data-day="Thursday" aria-controls="dayPanel">Thu</button>
            <button type="button" class="day" role="tab" data-day="Friday" aria-controls="dayPanel">Fri</button>
            <button type="button" class="day" role="tab" data-day="Saturday" aria-controls="dayPanel">Sat</button>
            <button type="button" class="day" role="tab" data-day="Sunday" aria-controls="dayPanel">Sun</button>
        </nav>

        <section class="day-view" id="dayPanel" role="tabpanel" tabindex="-1" aria-labelledby="dayTitle">
            <div class="day-head">
                <div>
                    <p class="eyebrow" id="dayEyebrow"></p>
                    <h1 id="dayTitle">Time Table</h1>
                </div>
                <ul class="summary" id="daySummary" aria-label="Day summary"></ul>
            </div>

            <ol class="schedule" id="schedule"></ol>
        </section>

        <section class="week" aria-labelledby="weekTitle">
            <div class="section-head">
                <h2 id="weekTitle">Week at a glance</h2>
                <p class="legend" aria-hidden="true">
                    <span class="legend-item"><i class="swatch swatch-lecture"></i>Lecture</span>
                    <span class="legend-item"><i class="swatch swatch-lab"></i>Lab</span>
                    <span class="legend-item"><i class="swatch swatch-break"></i>Lunch</span>
                </p>
            </div>
            <div class="week-grid" id="weekGrid"></div>
            <p class="week-note" id="weekNote"></p>
        </section>

    </main>

</div>

<script src="data.js"></script>
<script src="script.js"></script>
</body>
</html>
